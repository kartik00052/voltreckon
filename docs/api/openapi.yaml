    CdrPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Cdr'
    CsvImportJob:
      type: object
      required: [jobId, status, acceptedRows, rejectedRows]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        acceptedRows:
          type: integer
        rejectedRows:
          type: integer
    RatingRun:
      type: object
      required: [id, status, cpoPartnerId, emspPartnerId, periodStart, periodEnd]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED]
        cpoPartnerId:
          type: string
          format: uuid
        emspPartnerId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        processedCount:
          type: integer
        failedCount:
          type: integer
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        errorSummary:
          type: [string, 'null']
    RatingRunCreate:
      type: object
      required: [cpoPartnerId, emspPartnerId, periodStart, periodEnd]
      properties:
        cpoPartnerId:
          type: string
          format: uuid
        emspPartnerId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    RatingLine:
      type: object
      required: [lineNo, componentType, quantity, unitPrice, amount, tax]
      properties:
        lineNo:
          type: integer
        componentType:
          type: string
          enum: [ENERGY, TIME, PARKING_TIME, FLAT]
        description:
          type: [string, 'null']
        quantity:
          type: number
          format: double
        unit:
          type: [string, 'null']
        unitPrice:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        taxRateId:
          type: [string, 'null']
          format: uuid
        tax:
          $ref: '#/components/schemas/Money'
    RatingResult:
      type: object
      required: [id, cdrId, agreementId, tariffVersionId, energyWh, subtotal, tax, total, declaredTotal, variance, computedAt]
      properties:
        id:
          type: string
          format: uuid
        cdrId:
          type: string
          format: uuid
        agreementId:
          type: string
          format: uuid
        tariffVersionId:
          type: string
          format: uuid
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        energyWh:
          type: integer
          format: int64
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        declaredTotal:
          $ref: '#/components/schemas/Money'
        variance:
          $ref: '#/components/schemas/Money'
        varianceType:
          type: string
          enum: [NONE, AMOUNT, ENERGY, CURRENCY, MISSING_TARIFF, MISSING_AGREEMENT]
        computedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RatingLine'
    InvoiceLine:
      type: object
      required: [lineNo, ratingResultId, description, quantity, unitPrice, taxableAmount, tax, total]
      properties:
        lineNo:
          type: integer
        ratingResultId:
          type: string
          format: uuid
        description:
          type: string
        hsnSac:
          type: [string, 'null']
        quantity:
          type: number
        unit:
          type: [string, 'null']
        unitPrice:
          $ref: '#/components/schemas/Money'
        taxableAmount:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    InvoiceTaxLine:
      type: object
      required: [taxKind, rateBp, taxableAmount, taxAmount]
      properties:
        taxKind:
          type: string
          enum: [CGST, SGST, IGST, CESS]
        rateBp:
          type: integer
        taxableAmount:
          $ref: '#/components/schemas/Money'
        taxAmount:
          $ref: '#/components/schemas/Money'
    Invoice:
      type: object
      required: [id, issuerPartnerId, recipientPartnerId, status, currency, subtotal, tax, total]
      properties:
        id:
          type: string
          format: uuid
        invoiceNo:
          type: [string, 'null']
        issuerPartnerId:
          type: string
          format: uuid
        recipientPartnerId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, ISSUED, CANCELLED, PARTIALLY_CREDITED, FULLY_CREDITED, CLOSED]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        periodStart:
          type: [string, 'null']
          format: date
        periodEnd:
          type: [string, 'null']
          format: date
        issueDate:
          type: [string, 'null']
          format: date
        dueDate:
          type: [string, 'null']
          format: date
        placeOfSupplyState:
          type: [string, 'null']
        gstinIssuer:
          type: [string, 'null']
        gstinRecipient:
          type: [string, 'null']
        financialYear:
          type: [string, 'null']
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        taxLines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceTaxLine'
        createdAt:
          type: string
          format: date-time
        issuedAt:
          type: [string, 'null']
          format: date-time
    InvoiceCreate:
      type: object
      required: [ratingResultIds, placeOfSupplyState, gstinIssuer, gstinRecipient]
      properties:
        ratingResultIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        placeOfSupplyState:
          type: string
          minLength: 2
          maxLength: 2
        gstinIssuer:
          type: string
        gstinRecipient:
          type: string
        dueDate:
          type: [string, 'null']
          format: date
    InvoicePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
