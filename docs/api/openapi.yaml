openapi: 3.1.0
info:
  title: VoltReckon API
  version: 0.1.0
  summary: EV charging reconciliation and settlement workbench
  description: |
    Design contract for the VoltReckon MVP API. This specification describes
    intended behaviour; no server is implemented yet.

    Conventions:
      * Base path: /api/v1
      * JSON only; errors use application/problem+json
      * Money is integer minor units with an ISO-4217 currency
      * Idempotency-Key is required on financial POST operations
      * The tenant is derived from the bearer token, never from a request body
  contact:
    name: VoltReckon maintainers
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Partners
    description: Organisations, roles, users, and GST identities.
  - name: Agreements
    description: Directional CPO/eMSP commercial agreements and their tariff links.
  - name: Tariffs
    description: Immutable, effective-dated tariff versions and price components.
  - name: CDRs
    description: Immutable charge detail record ingestion, validation, and quarantine.
  - name: Rating
    description: Deterministic rating runs against pinned agreements and tariffs.
  - name: Invoices
    description: Invoice drafts, issue, tax lines, and credit notes.
  - name: Reconciliation
    description: Partner invoice matching and exception resolution.
  - name: Ledger
    description: Double-entry journals, trial balance, and accounting periods.
  - name: Settlement
    description: Netting runs and immutable settlement statements.
  - name: Disputes
    description: Dispute cases, evidence metadata, and state transitions.
  - name: Reports
    description: Read-only summaries and exports.
security:
  - bearerAuth: []
paths:
  /api/v1/partners/me:
    get:
      tags: [Partners]
      operationId: getCurrentPartner
      summary: Get the authenticated partner
      responses:
        '200':
          description: Current partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/partners:
    get:
      tags: [Partners]
      operationId: listPartners
      summary: List partners (platform admin)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Partner page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Partners]
      operationId: registerPartner
      summary: Register a partner (platform admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistration'
      responses:
        '201':
          description: Partner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/partners/{partnerId}:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      tags: [Partners]
      operationId: getPartner
      summary: Get a partner
      responses:
        '200':
          description: Partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/partners/{partnerId}/status:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    patch:
      tags: [Partners]
      operationId: changePartnerStatus
      summary: Suspend or reactivate a partner (platform admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED]
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/agreements:
    get:
      tags: [Agreements]
      operationId: listAgreements
      summary: List agreements for the current partner
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Agreement page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementPage'
    post:
      tags: [Agreements]
      operationId: createAgreement
      summary: Create a draft agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementCreate'
      responses:
        '201':
          description: Agreement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/agreements/{agreementId}:
    parameters:
      - $ref: '#/components/parameters/AgreementId'
    get:
      tags: [Agreements]
      operationId: getAgreement
      summary: Get an agreement
      responses:
        '200':
          description: Agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/agreements/{agreementId}/activate:
    parameters:
      - $ref: '#/components/parameters/AgreementId'
    post:
      tags: [Agreements]
      operationId: activateAgreement
      summary: Activate a draft agreement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Activated agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/agreements/{agreementId}/terminate:
    parameters:
      - $ref: '#/components/parameters/AgreementId'
    post:
      tags: [Agreements]
      operationId: terminateAgreement
      summary: Terminate an agreement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveTo, reason]
              properties:
                effectiveTo:
                  type: string
                  format: date
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Terminated agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
  /api/v1/agreements/{agreementId}/tariffs:
    parameters:
      - $ref: '#/components/parameters/AgreementId'
    post:
      tags: [Agreements]
      operationId: linkAgreementTariff
      summary: Link a tariff version to an agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tariffVersionId]
              properties:
                tariffVersionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Agreement with linked tariff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'

  /api/v1/tariffs:
    get:
      tags: [Tariffs]
      operationId: listTariffs
      summary: List tariffs for the current partner
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tariff page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffPage'
    post:
      tags: [Tariffs]
      operationId: createTariff
      summary: Create a tariff identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffCreate'
      responses:
        '201':
          description: Tariff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/tariffs/{tariffId}:
    parameters:
      - $ref: '#/components/parameters/TariffId'
    get:
      tags: [Tariffs]
      operationId: getTariff
      summary: Get a tariff with versions
      responses:
        '200':
          description: Tariff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tariffs/{tariffId}/versions:
    parameters:
      - $ref: '#/components/parameters/TariffId'
    post:
      tags: [Tariffs]
      operationId: createTariffVersion
      summary: Create a draft tariff version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffVersionCreate'
      responses:
        '201':
          description: Draft version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffVersion'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/tariffs/{tariffId}/versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/TariffId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Tariffs]
      operationId: publishTariffVersion
      summary: Publish a tariff version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffVersion'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tariffs/{tariffId}/versions/effective:
    parameters:
      - $ref: '#/components/parameters/TariffId'
    get:
      tags: [Tariffs]
      operationId: getEffectiveTariffVersion
      summary: Get the version effective at a point in time
      parameters:
        - name: at
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Effective version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffVersion'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cdrs:
    get:
      tags: [CDRs]
      operationId: listCdrs
      summary: List CDRs for the current partner
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: cpoPartnerId
          in: query
          schema:
            type: string
            format: uuid
        - name: emspPartnerId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: ingestStatus
          in: query
          schema:
            type: string
            enum: [ACCEPTED, QUARANTINED]
      responses:
        '200':
          description: CDR page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrPage'
    post:
      tags: [CDRs]
      operationId: ingestCdr
      summary: Ingest a single CDR
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CdrCreate'
      responses:
        '201':
          description: CDR accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrIngestResponse'
        '200':
          description: Duplicate detected; original returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrIngestResponse'
        '422':
          description: CDR quarantined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrIngestResponse'
  /api/v1/cdrs/import:
    post:
      tags: [CDRs]
      operationId: importCdrsCsv
      summary: Import CDRs from a CSV file
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  enum: [CSV]
                  default: CSV
      responses:
        '202':
          description: Import accepted; poll the job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportJob'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/cdrs/{cdrId}:
    parameters:
      - $ref: '#/components/parameters/CdrId'
    get:
      tags: [CDRs]
      operationId: getCdr
      summary: Get a CDR with validation issues
      responses:
        '200':
          description: CDR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cdr'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/rating-runs:
    post:
      tags: [Rating]
      operationId: startRatingRun
      summary: Start a rating run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRunCreate'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingRun'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/rating-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Rating]
      operationId: getRatingRun
      summary: Get rating run status
      responses:
        '200':
          description: Rating run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/rating-results/{resultId}:
    parameters:
      - name: resultId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Rating]
      operationId: getRatingResult
      summary: Get a rating result with lines and variance
      responses:
        '200':
          description: Rating result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices for the current partner
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ISSUED, CANCELLED, PARTIALLY_CREDITED, FULLY_CREDITED, CLOSED]
      responses:
        '200':
          description: Invoice page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
    post:
      tags: [Invoices]
      operationId: createInvoiceDraft
      summary: Create an invoice draft from rating results
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Draft invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an invoice
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/invoices/{invoiceId}/issue:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [Invoices]
      operationId: issueInvoice
      summary: Issue an invoice and post the journal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Issued invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/invoices/{invoiceId}/credit-notes:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [Invoices]
      operationId: createCreditNote
      summary: Issue a credit note against an invoice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteCreate'
      responses:
        '201':
          description: Credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/reconciliation-runs:
    post:
      tags: [Reconciliation]
      operationId: startReconciliationRun
      summary: Reconcile a partner invoice against CDRs
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationRunCreate'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/reconciliation-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Reconciliation]
      operationId: getReconciliationRun
      summary: Get reconciliation run status
      responses:
        '200':
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reconciliation-runs/{runId}/exceptions:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Reconciliation]
      operationId: listReconciliationExceptions
      summary: List exceptions for a run
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, RESOLVED, WAIVED]
      responses:
        '200':
          description: Exception page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationExceptionPage'
  /api/v1/reconciliation-exceptions/{exceptionId}/resolve:
    parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reconciliation]
      operationId: resolveReconciliationException
      summary: Resolve or waive an exception
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionResolution'
      responses:
        '200':
          description: Updated exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationException'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/ledger/trial-balance:
    get:
      tags: [Ledger]
      operationId: getTrialBalance
      summary: Get the trial balance per entity and period
      parameters:
        - name: entityPartnerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: periodCode
          in: query
          required: true
          schema:
            type: string
            example: '2026-11'
      responses:
        '200':
          description: Trial balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
  /api/v1/ledger/journal-entries:
    get:
      tags: [Ledger]
      operationId: listJournalEntries
      summary: List journal entries
      parameters:
        - name: entityPartnerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [INVOICE, CREDIT_NOTE, SETTLEMENT, ADJUSTMENT]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Journal entry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryPage'
  /api/v1/accounting-periods:
    get:
      tags: [Ledger]
      operationId: listAccountingPeriods
      summary: List accounting periods
      responses:
        '200':
          description: Periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingPeriod'
  /api/v1/accounting-periods/{periodCode}/close:
    parameters:
      - name: periodCode
        in: path
        required: true
        schema:
          type: string
          example: '2026-11'
    post:
      tags: [Ledger]
      operationId: closeAccountingPeriod
      summary: Close an accounting period (privileged)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriod'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/settlement-runs:
    post:
      tags: [Settlement]
      operationId: startSettlementRun
      summary: Start a settlement netting run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementRunCreate'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementRun'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/settlement-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Settlement]
      operationId: getSettlementRun
      summary: Get settlement run status
      responses:
        '200':
          description: Settlement run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/settlement-runs/{runId}/statement:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Settlement]
      operationId: getSettlementStatement
      summary: Get the immutable settlement statement
      responses:
        '200':
          description: Settlement statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementStatement'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/disputes:
    get:
      tags: [Disputes]
      operationId: listDisputes
      summary: List disputes for the current partner
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, UNDER_REVIEW, ACCEPTED, REJECTED, RESOLVED, WITHDRAWN, CLOSED]
      responses:
        '200':
          description: Dispute page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputePage'
    post:
      tags: [Disputes]
      operationId: openDispute
      summary: Open a dispute
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeCreate'
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/disputes/{disputeId}:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    get:
      tags: [Disputes]
      operationId: getDispute
      summary: Get a dispute with evidence and timeline
      responses:
        '200':
          description: Dispute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/disputes/{disputeId}/transitions:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    post:
      tags: [Disputes]
      operationId: transitionDispute
      summary: Advance a dispute state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeTransition'
      responses:
        '200':
          description: Updated dispute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/disputes/{disputeId}/evidence:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    post:
      tags: [Disputes]
      operationId: addDisputeEvidence
      summary: Attach evidence metadata
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeEvidenceCreate'
      responses:
        '201':
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeEvidence'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/reports/cdr-summary:
    get:
      tags: [Reports]
      operationId: getCdrSummary
      summary: CDR ingestion and validation summary
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CDR summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdrSummary'
  /api/v1/reports/rating-variance:
    get:
      tags: [Reports]
      operationId: getRatingVarianceReport
      summary: Rating variance by partner and period
      parameters:
        - name: periodCode
          in: query
          required: true
          schema:
            type: string
            example: '2026-11'
      responses:
        '200':
          description: Variance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingVarianceReport'
  /api/v1/reports/invoice-register:
    get:
      tags: [Reports]
      operationId: getInvoiceRegister
      summary: Invoice register with totals
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Invoice register
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceRegister'
  /api/v1/reports/exception-ageing:
    get:
      tags: [Reports]
      operationId: getExceptionAgeing
      summary: Open reconciliation exceptions by age
      responses:
        '200':
          description: Exception ageing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionAgeingReport'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgreementId:
      name: agreementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TariffId:
      name: tariffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CdrId:
      name: cdrId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DisputeId:
      name: disputeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    Gstin:
      type: object
      required: [gstin, stateCode]
      properties:
        gstin:
          type: string
          pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$'
        stateCode:
          type: string
          minLength: 2
          maxLength: 2
        legalName:
          type: string
        isPrimary:
          type: boolean
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
    Partner:
      type: object
      required: [id, legalName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        displayName:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        roles:
          type: array
          items:
            type: string
            enum: [CPO, EMSP]
        gstins:
          type: array
          items:
            $ref: '#/components/schemas/Gstin'
        createdAt:
          type: string
          format: date-time
    PartnerRegistration:
      type: object
      required: [legalName, roles]
      properties:
        legalName:
          type: string
          minLength: 2
          maxLength: 300
        displayName:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [CPO, EMSP]
        gstins:
          type: array
          items:
            $ref: '#/components/schemas/Gstin'
    PartnerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Partner'
    Agreement:
      type: object
      required: [id, cpoPartnerId, emspPartnerId, status, currency, settlementCycle, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        cpoPartnerId:
          type: string
          format: uuid
        emspPartnerId:
          type: string
          format: uuid
        agreementRef:
          type: [string, 'null']
        status:
          type: string
          enum: [DRAFT, ACTIVE, TERMINATED]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        settlementCycle:
          type: string
          enum: [WEEKLY, MONTHLY]
        paymentTermsDays:
          type: integer
          minimum: 0
        billingPeriodBasis:
          type: string
          enum: [SESSION_START, SESSION_END]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        tariffVersionIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    AgreementCreate:
      type: object
      required: [cpoPartnerId, emspPartnerId, currency, effectiveFrom]
      properties:
        cpoPartnerId:
          type: string
          format: uuid
        emspPartnerId:
          type: string
          format: uuid
        agreementRef:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        settlementCycle:
          type: string
          enum: [WEEKLY, MONTHLY]
          default: MONTHLY
        paymentTermsDays:
          type: integer
          minimum: 0
          default: 30
        billingPeriodBasis:
          type: string
          enum: [SESSION_START, SESSION_END]
          default: SESSION_START
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
    AgreementPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Agreement'
    PriceComponent:
      type: object
      required: [componentType, priceMinor, stepSize]
      properties:
        componentType:
          type: string
          enum: [ENERGY, TIME, PARKING_TIME, FLAT]
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        stepSize:
          type: integer
          minimum: 1
        taxRateId:
          type: [string, 'null']
          format: uuid
    Restriction:
      type: object
      properties:
        startTime:
          type: [string, 'null']
          format: time
        endTime:
          type: [string, 'null']
          format: time
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        minDurationSeconds:
          type: [integer, 'null']
          minimum: 0
        maxDurationSeconds:
          type: [integer, 'null']
          minimum: 0
        minEnergyWh:
          type: [integer, 'null']
          format: int64
          minimum: 0
        maxEnergyWh:
          type: [integer, 'null']
          format: int64
          minimum: 0
        minPowerW:
          type: [integer, 'null']
          format: int64
          minimum: 0
        maxPowerW:
          type: [integer, 'null']
          format: int64
          minimum: 0
        minCurrentA:
          type: [integer, 'null']
          minimum: 0
        maxCurrentA:
          type: [integer, 'null']
          minimum: 0
    TariffElement:
      type: object
      required: [elementOrder, components]
      properties:
        elementOrder:
          type: integer
          minimum: 0
        components:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PriceComponent'
        restrictions:
          $ref: '#/components/schemas/Restriction'
    Tariff:
      type: object
      required: [id, ownerPartnerId, code, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ownerPartnerId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: [string, 'null']
        versions:
          type: array
          items:
            $ref: '#/components/schemas/TariffVersion'
        createdAt:
          type: string
          format: date-time
    TariffCreate:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
    TariffVersion:
      type: object
      required: [id, tariffId, versionNo, status, currency, effectiveFrom, elements]
      properties:
        id:
          type: string
          format: uuid
        tariffId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [DRAFT, PUBLISHED, SUPERSEDED]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: [string, 'null']
          format: date-time
        contentHash:
          type: [string, 'null']
        elements:
          type: array
          items:
            $ref: '#/components/schemas/TariffElement'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
    TariffVersionCreate:
      type: object
      required: [versionNo, currency, effectiveFrom, elements]
      properties:
        versionNo:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: [string, 'null']
          format: date-time
        elements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TariffElement'
    TariffPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Tariff'
    ValidationIssue:
      type: object
      required: [issueCode, severity]
      properties:
        issueCode:
          type: string
        severity:
          type: string
          enum: [WARNING, ERROR]
        detail:
          type: string
    Cdr:
      type: object
      required: [id, cpoPartnerId, emspPartnerId, cdrExternalId, startDateTime, endDateTime, totalEnergyWh, totalCost, credit, ingestStatus]
      properties:
        id:
          type: string
          format: uuid
        cpoPartnerId:
          type: string
          format: uuid
        emspPartnerId:
          type: string
          format: uuid
        cdrExternalId:
          type: string
        sessionExternalId:
          type: [string, 'null']
        tokenUid:
          type: [string, 'null']
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        totalEnergyWh:
          type: integer
          format: int64
          minimum: 0
        totalTimeSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
        totalCost:
          $ref: '#/components/schemas/Money'
        credit:
          type: boolean
        creditReferenceCdrId:
          type: [string, 'null']
          format: uuid
        source:
          type: string
          enum: [OCPI_JSON, CSV, MANUAL]
        ingestStatus:
          type: string
          enum: [ACCEPTED, QUARANTINED]
        ingestedAt:
          type: string
          format: date-time
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    CdrCreate:
      type: object
      required: [cdrExternalId, startDateTime, endDateTime, totalEnergyWh, totalCost, source]
      properties:
        cdrExternalId:
          type: string
          minLength: 1
          maxLength: 200
        sessionExternalId:
          type: string
        tokenUid:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        totalEnergyWh:
          type: integer
          format: int64
          minimum: 0
        totalTimeSeconds:
          type: integer
          format: int64
          minimum: 0
        totalCost:
          $ref: '#/components/schemas/Money'
        credit:
          type: boolean
          default: false
        creditReferenceCdrId:
          type: string
          format: uuid
        source:
          type: string
          enum: [OCPI_JSON, CSV, MANUAL]
        rawPayload:
          type: object
    CdrIngestResponse:
      type: object
      required: [created, cdr]
      properties:
        created:
          type: boolean
        duplicateOf:
          type: [string, 'null']
          format: uuid
        cdr:
