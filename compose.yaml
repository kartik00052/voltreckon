services:
  postgres:
    image: postgres:18
    container_name: voltreckon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltreckon}
      POSTGRES_USER: ${POSTGRES_USER:-voltreckon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltreckon_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    name: voltreckon-pgdata
